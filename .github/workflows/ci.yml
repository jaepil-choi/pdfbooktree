name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and project
        run: uv sync --locked --extra ocr --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  quality:
    name: Quality / Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and project
        run: uv sync --locked --extra ocr --dev --python 3.12

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

  package:
    name: Package / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Build sdist and wheel once
        run: uv build --python 3.12 --out-dir dist

      - name: Check distribution metadata
        run: uv run --python 3.12 --with twine twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: Wheel smoke / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist

      - name: Run clean-install wheel smoke
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl -File -Recurse).FullName
          $sdist = (Get-ChildItem dist -Filter *.tar.gz -File -Recurse).FullName
          if (($wheel.Count -ne 1) -or ($sdist.Count -ne 1)) {
            throw "Expected exactly one wheel and one sdist."
          }
          uv run --python 3.12 python scripts/smoke_test_wheel.py `
            --python-version "${{ matrix.python-version }}" `
            --wheel $wheel `
            --sdist $sdist `
            --output-root "${{ runner.temp }}/pdfbooktree-wheel-smoke"

  ci-green:
    name: ci-green
    if: always()
    needs:
      - tests
      - quality
      - package
      - wheel-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI job
        shell: bash
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          WHEEL_SMOKE_RESULT: ${{ needs.wheel-smoke.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$WHEEL_SMOKE_RESULT" = "success"
