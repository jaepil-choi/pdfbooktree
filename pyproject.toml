[project]
name = "pdfbooktree"
version = "0.1.0"
description = "PDF의 typography hierarchy로 bookmark와 Markdown tree를 생성한다."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jaepil.Choi", email = "chljeffreyz@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "pdf",
    "bookmarks",
    "ocr",
    "markdown",
    "typography",
    "obsidian",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pikepdf>=10.9.1",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.68.1",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/jaepil-choi/pdfbooktree"
Repository = "https://github.com/jaepil-choi/pdfbooktree"
Issues = "https://github.com/jaepil-choi/pdfbooktree/issues"
Documentation = "https://github.com/jaepil-choi/pdfbooktree#readme"

[project.scripts]
pdfbooktree = "pdfbooktree.cli:main"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.ruff]
extend-exclude = [
    "experiments",
    "references",
]
