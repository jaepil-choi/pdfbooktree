[project]
name = "pdfbooktree"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jaepil.Choi", email = "chljeffreyz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.2",
    "joblib>=1.5.3",
    "langchain-core>=1.4.1",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "lightgbm>=4.6.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.27.0",
    "openai>=2.41.0",
    "ocrmypdf>=17.8.0",
    "httpx>=0.28.1",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "truststore>=0.10.4",
    "typer>=0.26.7",
]

[project.scripts]
pdfbooktree = "pdfbooktree.cli:main"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
]
llm = [
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
