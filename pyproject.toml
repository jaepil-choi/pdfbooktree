[project]
name = "pdfbooktree"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jaepil.Choi", email = "chljeffreyz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pymupdf>=1.27.2.3",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "typer>=0.26.7",
]

[project.scripts]
pdfbooktree = "pdfbooktree:main"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
]
llm = [
    "openai>=2.41.0",
    "pillow>=12.2.0",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
